# Build and deploy SocialFTE to existing VPS via Dokploy.
# Two apps (dashboard + worker) on the same Dokploy instance as Octively.
# Every master push builds; deploy runs on master + manual dispatch.

name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  # GHCR requires lowercase — replace <your-username> with your GitHub username.
  IMAGE_DASHBOARD: ghcr.io/mrowaisabdullah/socialfte-dashboard
  IMAGE_WORKER: ghcr.io/mrowaisabdullah/socialfte-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.dashboard
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_DASHBOARD }}:latest
            ${{ env.IMAGE_DASHBOARD }}:${{ github.sha }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.worker
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_WORKER }}:latest
            ${{ env.IMAGE_WORKER }}:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy — dashboard
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"${{ secrets.DOKPLOY_APP_ID_DASHBOARD }}"}'

      - name: Trigger Dokploy deploy — worker
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId":"${{ secrets.DOKPLOY_APP_ID_WORKER }}"}'
